
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى إسراء ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <main class="card">
    <div class="flower">🌹</div>

    <h1>إلى حبيبتي إسراء</h1>
    <p class="subtitle">أنتِ أجمل حاجة حصلت في حياتي ❤️</p>

    <div class="heart">♥</div>

    <p class="message">
      يمكن الكلام مش هيقدر يوصف مكانتك عندي،
      بس حبيت أعملك حاجة صغيرة تفكرك
      إن فيه قلب بيحبك وبيختارك كل يوم.
    </p>

    <button id="surpriseBtn">اضغطي هنا يا إسراء 💌</button>

    <div id="surprise" class="hidden">
      <h2>بحبك يا إسراء ❤️</h2>
      <p>
        ربنا يخليكي ليا، ويفضل وجودك أجمل
        تفاصيل أيامي، ونفضل سوا مهما حصل.
      </p>
      <div class="flower">💗🌹💗</div>
    </div>

    <footer>صُنعت بكل الحب ❤️</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
